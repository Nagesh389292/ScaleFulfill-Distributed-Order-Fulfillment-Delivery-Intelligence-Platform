server:
  port: 8084

spring:
  application:
    name: search-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  orders-index: orders-index
  products-index: products-index

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: scalefulfill
      service: search-service
    distribution:
      percentiles-histogram:
        scalefulfill.search.query.duration: true
      slo:
        scalefulfill.search.query.duration: 5ms,10ms,20ms,30ms,50ms,100ms,250ms,500ms

logging:
  level:
    com.scalefulfill.search: INFO
