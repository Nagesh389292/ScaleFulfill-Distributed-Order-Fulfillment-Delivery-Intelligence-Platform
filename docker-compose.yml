version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scalefulfill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scalefulfill_db
      POSTGRES_USER: scalefulfill_user
      POSTGRES_PASSWORD: scalefulfill_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalefulfill_user -d scalefulfill_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: scalefulfill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
